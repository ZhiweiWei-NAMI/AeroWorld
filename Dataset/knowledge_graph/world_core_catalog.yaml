schema: aeroworld.world_core_catalog.v1
version: 0.3.0
ontology_iri: https://w3id.org/aeroworld/ontology/world
namespace: https://w3id.org/aeroworld/ontology/world#
title_en: AeroWorld Shared World Core Ontology
title_zh: AeroWorld 共享世界核心本体
scope_en: Shared physical entities, spatial regions, road and airspace topology, basic facilities, and generic time-indexed entity state reused across stable domain modules. Dataset scenario-family labels are external selection metadata, not ontology levels.
scope_zh: 由稳定领域模块复用的共享物理实体、空间区域、道路与空域拓扑、基础设施以及通用带时间索引实体状态。数据集场景族标签是外部选择元数据，不是本体等级。

evidence:
  audit_date: 2026-07-30
  provenance_policy: Catalog evidence records empirical audit provenance only. It is not an executable ontology binding and must not be emitted into world_core.ttl as TBox assertions.
  audited_episode_root: G:/aw_data/render_ready_episodes_capture_filtered
  formal_episode_count: 210
  observed_roster_entity_records: 15247
  observed_scenario_family_signatures:
    - {count: 10909, category: vehicle, kind: vehicle.car, present_in_scenario_families: [L1, L2, L3, L4, L5, L6, X]}
    - {count: 1365, category: airspace_corridor, kind: airspace_corridor.uav_corridor, present_in_scenario_families: [L1, L2, L3, L4, L5, L6, X]}
    - {count: 1287, category: uav, kind: uav.drone, present_in_scenario_families: [L1, L2, L3, L4, L5, L6, X]}
    - {count: 849, category: pedestrian, kind: pedestrian.person, present_in_scenario_families: [L1, L2, L3, L4, L5, L6, X]}
    - {count: 387, category: facility, kind: facility.landing_pad, label: facility, present_in_scenario_families: [L1, L2, L3, L4, L5, L6, X]}
    - {count: 159, category: facility, kind: facility.charger, present_in_scenario_families: [L1, L2, L3, L4, L5, L6, X]}
    - {count: 123, category: facility, kind: facility.base_station, present_in_scenario_families: [L1, L2, L3, L6, X]}
    - {count: 48, category: facility, kind: facility.landing_pad, label: landing_pad, present_in_scenario_families: [L2, L3, L4, L6, X]}
    - {count: 39, category: facility, kind: facility.no_fly_zone, present_in_scenario_families: [L1, L3, X]}
    - {count: 39, category: prop, present_in_scenario_families: [L3, L5, X]}
    - {count: 12, category: facade_anchor, present_in_scenario_families: [L2, L4]}
    - {count: 9, category: crowd_anchor, present_in_scenario_families: [L4, X]}
    - {count: 6, category: ground_station, kind: ground_station.radio_tower, present_in_scenario_families: [L6]}
    - {count: 3, category: traffic_light, kind: traffic_light.signal, present_in_scenario_families: [L2]}
  source_contracts:
    - artifact: global_entity_roster.json
      fields: [entity_id, entity_category, entity_kind, entity_type, site_id, roi_id, logical_asset_id, state_sequence]
      semantic_use: Stable episode entities and their declared kinds, spatial scope, assets, and state vocabulary.
    - artifact: truth_frames.jsonl
      fields: [episode_id, frame_id, tick, map_id, active_site_id, active_roi_id, capture_boundary_id, entities.truth_pose, entities.annotations, entities.state, entities.sumo_vehicle, entities.uav_corridor]
      semantic_use: Time-indexed pose, motion, activity, operational state, lane occupancy, and corridor assignment.
    - artifact: trajectories.jsonl
      fields: [tick, entity_id, entity_category, pos_enu, vel_mps, yaw_deg, state, activity_type]
      semantic_use: Compact per-entity state sequence over simulation time.
    - artifact: Content/Maps/donghu_road_topo/road/road.geojson
      fields: [properties.id, properties.lanes, properties.width, properties.direction, geometry]
      semantic_use: Road objects and their source geometry.
    - artifact: Config/LowAltitude/Maps/donghu_road_topo/traffic_bundle/lane_meta.csv
      fields: [edge_id, lane_id, lane_index, length_m, speed_mps, source_road_id, lane_width_m]
      semantic_use: Road-segment and lane identity plus lane attributes.
    - artifact: Config/LowAltitude/Maps/donghu_road_topo/traffic_bundle/lane_connections.csv
      fields: [from_edge, from_lane, to_edge, to_lane, via_lane]
      semantic_use: Directed lane connectivity.

classes:
  - {id: PhysicalEntity, parent: "aw:Entity", label_en: physical entity, label_zh: 物理实体, definition_en: An episode entity with an objective physical presence., definition_zh: 在 episode 中具有客观物理存在的实体。, evidence: [global_entity_roster.json.entities]}
  - {id: PhysicalObject, parent: PhysicalEntity, label_en: physical object, label_zh: 物理对象, definition_en: A non-agent physical entity represented in the world., definition_zh: 世界中被表示的非主体物理实体。, evidence: [global_entity_roster.json.entities]}
  - {id: InformationEntity, parent: "aw:Entity", label_en: information entity, label_zh: 信息实体, definition_en: A non-physical information object, rule, message, task description, or digital artifact represented in the semantic world., definition_zh: 语义世界中表示的非物理信息对象、规则、消息、任务描述或数字制品。}
  - {id: Process, parent: "aw:Entity", label_en: process, label_zh: 过程, definition_en: A time-extended operation, communication, computation, control, service, or emergency procedure represented as an objective semantic entity., definition_zh: 作为客观语义实体表示的跨时间运行、通信、计算、控制、服务或应急程序。}
  - {id: Resource, parent: "aw:Entity", label_en: resource, label_zh: 资源, definition_en: A usable capacity, allocation target, or service resource that may be consumed, reserved, or saturated by a process., definition_zh: 可被过程消耗、预留或饱和的容量、分配目标或服务资源。}
  - {id: NormativeEntity, parent: InformationEntity, label_en: normative entity, label_zh: 规范实体, definition_en: A rule-like information entity expressing permission, prohibition, obligation, right-of-way, applicability, or violation semantics., definition_zh: 表达许可、禁止、义务、路权、适用性或违规语义的规则型信息实体。}
  - {id: Agent, parent: PhysicalEntity, label_en: agent, label_zh: 主体, definition_en: A physical entity capable of stateful movement or action., definition_zh: 能够进行有状态运动或行动的物理实体。, evidence: [truth_frames.jsonl.entities]}
  - {id: MobileAgent, parent: Agent, label_en: mobile agent, label_zh: 移动主体, definition_en: An agent whose objective pose may change over simulation time., definition_zh: 客观位姿可随仿真时间变化的主体。, evidence: [trajectories.jsonl]}
  - {id: AerialAgent, parent: MobileAgent, label_en: aerial agent, label_zh: 空中主体, definition_en: A mobile agent operating in airspace., definition_zh: 在空域中运行的移动主体。, evidence: [global_entity_roster.json.entity_category=uav]}
  - {id: GroundAgent, parent: MobileAgent, label_en: ground agent, label_zh: 地面主体, definition_en: A mobile agent operating on ground-space topology., definition_zh: 在地面空间拓扑上运行的移动主体。, evidence: [global_entity_roster.json.entity_category]}
  - {id: UnmannedAircraft, parent: AerialAgent, label_en: unmanned aircraft, label_zh: 无人机, definition_en: An aerial agent represented by the uav entity category., definition_zh: 由 uav 实体类别表示的空中主体。, evidence: [global_entity_roster.json.entity_category=uav]}
  - {id: GroundVehicle, parent: GroundAgent, label_en: ground vehicle, label_zh: 地面车辆, definition_en: A ground agent represented by the vehicle entity category and associated with road-lane state., definition_zh: 由 vehicle 实体类别表示并具有关联道路车道状态的地面主体。, evidence: [global_entity_roster.json.entity_category=vehicle, truth_frames.jsonl.entities.sumo_vehicle]}
  - {id: Pedestrian, parent: GroundAgent, label_en: pedestrian, label_zh: 行人, definition_en: A ground agent represented by the pedestrian entity category., definition_zh: 由 pedestrian 实体类别表示的地面主体。, evidence: [global_entity_roster.json.entity_category=pedestrian]}
  - {id: EmergencyResponder, parent: GroundAgent, label_en: emergency responder, label_zh: 应急响应主体, definition_en: A ground agent assigned an emergency-response role., definition_zh: 被赋予应急响应角色的地面主体。, evidence: [global_entity_roster.json.logical_asset_id=vehicle.emergency.ambulance.v1, global_entity_roster.json.sumo_vehicle.vehicle_type=aero_emergency, truth_frames.jsonl.entities.sumo_vehicle.semantic_metadata.logical_asset_id]}

  - {id: InfrastructureAsset, parent: PhysicalObject, label_en: infrastructure asset, label_zh: 基础设施资产, definition_en: A persistent physical object providing an operational service., definition_zh: 提供运行服务的持久物理对象。, evidence: [global_entity_roster.json.entity_category=facility]}
  - {id: CyberSecurityControl, parent: InfrastructureAsset, label_en: cyber security control, label_zh: 网络安全控制, definition_en: An infrastructure control that protects digital command, communication, or service processes., definition_zh: 保护数字指令、通信或服务过程的基础设施控制。, evidence: [global_entity_roster.json.entity_category=ground_station]}
  - {id: Facility, parent: InfrastructureAsset, label_en: facility, label_zh: 设施, definition_en: An infrastructure asset represented by a facility or ground-station entity category., definition_zh: 由 facility 或 ground_station 实体类别表示的基础设施资产。, evidence: [global_entity_roster.json.entity_category]}
  - {id: CommunicationStation, parent: Facility, label_en: communication station, label_zh: 通信站, definition_en: A facility supporting communication service., definition_zh: 提供通信服务的设施。, evidence: [global_entity_roster.json.entity_kind=facility.base_station]}
  - {id: GroundControlStation, parent: CommunicationStation, label_en: ground control station, label_zh: 地面控制站, definition_en: A communication station used to control unmanned aircraft., definition_zh: 用于控制无人机的通信站。, evidence: [global_entity_roster.json.entity_category=ground_station]}
  - {id: RadioTower, parent: CommunicationStation, label_en: radio tower, label_zh: 无线电塔, definition_en: A communication station represented by a radio-tower asset., definition_zh: 由 radio_tower 资产表示的通信站。, evidence: [global_entity_roster.json.label_class=radio_tower]}
  - {id: ChargingStation, parent: Facility, label_en: charging station, label_zh: 充电站, definition_en: A facility providing charging service to mobile agents., definition_zh: 向移动主体提供充电服务的设施。, evidence: [global_entity_roster.json.entity_kind=facility.charger]}
  - {id: LandingSite, parent: Facility, label_en: landing site, label_zh: 降落场地, definition_en: A facility designated for aircraft landing or recovery., definition_zh: 指定用于航空器降落或恢复的设施。, evidence: [global_entity_roster.json.entity_kind=facility.landing_pad]}
  - {id: LandingPad, parent: LandingSite, label_en: landing pad, label_zh: 起降坪, definition_en: A bounded landing-site resource used by unmanned aircraft., definition_zh: 供无人机使用的有界降落场地资源。, evidence: [global_entity_roster.json.label_class=landing_pad]}
  - {id: TrafficSignal, parent: InfrastructureAsset, label_en: traffic signal, label_zh: 交通信号灯, definition_en: An infrastructure asset controlling movements at an intersection., definition_zh: 控制路口交通运动的基础设施资产。, evidence: [global_entity_roster.json.entity_category=traffic_light]}
  - {id: PhysicalStructure, parent: PhysicalObject, label_en: physical structure, label_zh: 物理结构, definition_en: A persistent built or natural structure relevant to clearance and contact., definition_zh: 与净空及接触关系相关的持久建成或自然结构。, evidence: [global_entity_roster.json.entity_category=facade_anchor]}
  - {id: BuildingStructure, parent: PhysicalStructure, label_en: building structure, label_zh: 建筑结构, definition_en: A physical structure belonging to a building., definition_zh: 属于建筑物的物理结构。, evidence: [global_entity_roster.json.entity_category=facade_anchor]}
  - {id: Building, parent: BuildingStructure, label_en: building, label_zh: 建筑物, definition_en: A complete building represented in the operational world., definition_zh: 运行世界中表示的完整建筑物。, evidence: [global_entity_roster.json.entity_category=facade_anchor]}
  - {id: BuildingFacade, parent: BuildingStructure, label_en: building facade, label_zh: 建筑立面, definition_en: A building surface relevant to aircraft clearance or contact., definition_zh: 与航空器净空或接触相关的建筑表面。, evidence: [global_entity_roster.json.entity_category=facade_anchor]}
  - {id: SceneProp, parent: PhysicalObject, label_en: scene prop, label_zh: 场景物件, definition_en: A discrete physical object represented by the prop entity category., definition_zh: 由 prop 实体类别表示的离散物理对象。, evidence: [global_entity_roster.json.entity_category=prop]}
  - {id: Barrier, parent: SceneProp, label_en: barrier, label_zh: 隔离设施, definition_en: A scene prop that physically marks or blocks access., definition_zh: 用于物理标示或阻止通行的场景物件。, evidence: [global_entity_roster.json.entity_kind=prop.roadwork_barrier]}
  - {id: TrafficCone, parent: SceneProp, label_en: traffic cone, label_zh: 交通锥, definition_en: A scene prop used to mark temporary road constraints., definition_zh: 用于标示临时道路约束的场景物件。, evidence: [global_entity_roster.json.entity_kind=prop.traffic_cone]}
  - {id: Payload, parent: PhysicalObject, label_en: payload, label_zh: 载荷, definition_en: A physical object carried by a mobile agent., definition_zh: 由移动主体携带的物理对象。, evidence: [global_entity_roster.json.entity_kind=prop.delivery_bag]}
  - {id: HazardSource, parent: "aw:Entity", label_en: hazard source, label_zh: 危险源, definition_en: An entity or region from which an operational hazard originates., definition_zh: 运行危险的来源实体或区域。, evidence: [global_entity_roster.json.semantic_role]}

  - {id: OperationalMap, parent: "aw:Entity", label_en: operational map, label_zh: 运行地图, definition_en: The shared map reference within which episode sites, roads, airspace, and entity state are defined., definition_zh: 定义 episode 场地、道路、空域及实体状态的共享地图引用。, evidence: [truth_frames.jsonl.map_id]}
  - {id: SpatialRegion, parent: "aw:Entity", label_en: spatial region, label_zh: 空间区域, definition_en: A bounded or logically identified portion of the operational world., definition_zh: 运行世界中有界或由逻辑标识的空间部分。, evidence: [truth_frames.jsonl.site_id, truth_frames.jsonl.roi_id]}
  - {id: Site, parent: SpatialRegion, label_en: site, label_zh: 场地, definition_en: A named operational site shared by episode entities., definition_zh: episode 实体共同关联的命名运行场地。, evidence: [global_entity_roster.json.site_id]}
  - {id: RegionOfInterest, parent: SpatialRegion, label_en: region of interest, label_zh: 感兴趣区域, definition_en: A named region used to scope operational entities and state., definition_zh: 用于限定运行实体及状态范围的命名区域。, evidence: [global_entity_roster.json.roi_id]}
  - {id: SpatialBoundary, parent: "aw:Entity", label_en: spatial boundary, label_zh: 空间边界, definition_en: A geometric boundary delimiting a spatial region., definition_zh: 限定空间区域的几何边界。, evidence: [truth_frames.jsonl.capture_boundary_id]}
  - {id: CaptureBoundary, parent: SpatialBoundary, label_en: capture boundary, label_zh: 采集边界, definition_en: The objective spatial boundary associated with an episode capture region., definition_zh: 与 episode 采集区域关联的客观空间边界。, evidence: [truth_frames.jsonl.capture_boundary_id]}
  - {id: OperationalRegion, parent: SpatialRegion, label_en: operational region, label_zh: 运行区域, definition_en: A spatial region with operational meaning for agents or facilities., definition_zh: 对主体或设施具有运行含义的空间区域。, evidence: [global_entity_roster.json.tags]}
  - {id: LandingArea, parent: OperationalRegion, label_en: landing area, label_zh: 降落区域, definition_en: An operational region in which an aircraft may land., definition_zh: 航空器可执行降落的运行区域。, evidence: [global_entity_roster.json.semantic_role]}
  - {id: PopulatedArea, parent: OperationalRegion, label_en: populated area, label_zh: 人员活动区域, definition_en: An operational region occupied or ordinarily used by pedestrians or crowds., definition_zh: 由行人或人群占用或通常使用的运行区域。, evidence: [global_entity_roster.json.entity_category=pedestrian]}

  - {id: RoadElement, parent: PhysicalObject, label_en: road element, label_zh: 道路要素, definition_en: A physical or logical element of the shared road topology., definition_zh: 共享道路拓扑中的物理或逻辑要素。, evidence: [road.geojson, lane_meta.csv]}
  - {id: Roadway, parent: RoadElement, label_en: roadway, label_zh: 道路, definition_en: A traversable road object represented by source road geometry., definition_zh: 由道路源几何表示的可通行道路对象。, evidence: [road.geojson.features]}
  - {id: RoadSegment, parent: RoadElement, label_en: road segment, label_zh: 道路路段, definition_en: A directed or bounded segment of a roadway., definition_zh: 道路的有向或有界路段。, evidence: [lane_meta.csv.edge_id]}
  - {id: RoadLane, parent: RoadElement, label_en: road lane, label_zh: 道路车道, definition_en: A directed lane within a road segment., definition_zh: 道路路段内的有向车道。, evidence: [lane_meta.csv.lane_id]}
  - {id: Intersection, parent: RoadElement, label_en: intersection, label_zh: 道路交叉口, definition_en: A road-topology region connecting potentially conflicting movements., definition_zh: 连接潜在冲突交通运动的道路拓扑区域。, evidence: [lane_connections.csv.via_lane]}
  - {id: Crosswalk, parent: RoadElement, label_en: crosswalk, label_zh: 人行横道, definition_en: A road element designated for pedestrian crossing., definition_zh: 指定供行人横穿道路的道路要素。, evidence: [global_entity_roster.json.semantic_role]}
  - {id: Sidewalk, parent: RoadElement, label_en: sidewalk, label_zh: 人行道, definition_en: A road element designated for pedestrian movement beside a roadway., definition_zh: 道路旁指定供行人移动的道路要素。, evidence: [global_entity_roster.json.ground_flow_contract.route_source]}

  - {id: AirspaceRegion, parent: OperationalRegion, label_en: airspace region, label_zh: 空域区域, definition_en: A bounded three-dimensional operational region., definition_zh: 有界的三维运行区域。, evidence: [global_entity_roster.json.entity_category=airspace_corridor]}
  - {id: ProtectedAirspace, parent: AirspaceRegion, label_en: protected airspace, label_zh: 受保护空域, definition_en: Airspace governed by an access-protection policy., definition_zh: 受访问保护策略约束的空域。, evidence: [global_entity_roster.json.semantic_role]}
  - {id: RestrictedAirspaceRegion, parent: ProtectedAirspace, label_en: restricted airspace region, label_zh: 限制空域区域, definition_en: Protected airspace in which entry is prohibited or conditionally restricted., definition_zh: 禁止或有条件限制进入的受保护空域。, evidence: [global_entity_roster.json.entity_kind=facility.no_fly_zone]}
  - {id: NoFlyZone, parent: RestrictedAirspaceRegion, label_en: no-fly zone, label_zh: 禁飞区, definition_en: Restricted airspace in which flight is prohibited while active., definition_zh: 激活期间禁止飞行的限制空域。, evidence: [global_entity_roster.json.label_class=no_fly_zone]}
  - {id: AirspaceCorridor, parent: AirspaceRegion, label_en: airspace corridor, label_zh: 空中航路, definition_en: A three-dimensional route volume assigned to aircraft movement., definition_zh: 分配给航空器运动的三维航路体积。, evidence: [global_entity_roster.json.entity_category=airspace_corridor]}
  - {id: AltitudeBand, parent: AirspaceRegion, label_en: altitude band, label_zh: 高度层, definition_en: A vertical interval assigned or permitted for aircraft operation., definition_zh: 分配或允许航空器运行的垂直区间。, evidence: [truth_frames.jsonl.entities.assigned_altitude_m]}
  - {id: AirspaceBoundary, parent: SpatialBoundary, label_en: airspace boundary, label_zh: 空域边界, definition_en: A spatial boundary delimiting an airspace region., definition_zh: 限定空域区域的空间边界。, evidence: [truth_frames.jsonl.capture_boundary_id]}

  - {id: WorldFrame, parent: "aw:SourceRecord", label_en: world frame, label_zh: 世界帧, definition_en: The objective world-state record for one episode and one simulation tick., definition_zh: 一个 episode 在一个仿真 tick 的客观世界状态记录。, evidence: [truth_frames.jsonl]}
  - {id: EntityStateAtTick, parent: "aw:SourceRecord", label_en: entity state at tick, label_zh: 实体逐时刻状态, definition_en: The objective state of one stable entity within one world frame., definition_zh: 一个稳定实体在一个世界帧内的客观状态。, evidence: [truth_frames.jsonl.entities, trajectories.jsonl]}

object_relations:
  - {id: episodeUsesMap, domain: "aw:Episode", range: OperationalMap, label_en: episode uses map, label_zh: episode 使用地图, definition_en: Relates an episode to the operational map defining its world coordinates and topology., definition_zh: 将 episode 关联到定义其世界坐标和拓扑的运行地图。, evidence: [truth_frames.jsonl.map_id]}
  - {id: locatedAtSite, domain: "aw:Entity", range: Site, label_en: located at site, label_zh: 位于场地, definition_en: Relates an episode entity to its declared operational site., definition_zh: 将 episode 实体关联到其声明的运行场地。, evidence: [global_entity_roster.json.site_id]}
  - {id: locatedInRegionOfInterest, domain: "aw:Entity", range: RegionOfInterest, label_en: located in region of interest, label_zh: 位于感兴趣区域, definition_en: Relates an episode entity to its declared region of interest., definition_zh: 将 episode 实体关联到其声明的感兴趣区域。, evidence: [global_entity_roster.json.roi_id]}
  - {id: boundedBy, domain: SpatialRegion, range: SpatialBoundary, label_en: bounded by, label_zh: 由边界限定, definition_en: Relates a spatial region to a delimiting boundary., definition_zh: 将空间区域关联到限定其范围的边界。, evidence: [truth_frames.jsonl.capture_boundary_id]}
  - {id: overlapsRegion, domain: SpatialRegion, range: SpatialRegion, label_en: overlaps region, label_zh: 与区域重叠, definition_en: States that two spatial regions geometrically overlap., definition_zh: 表示两个空间区域在几何上重叠。, evidence: [road.geojson.geometry]}
  - {id: overlapsAirspaceRegion, domain: AirspaceCorridor, range: AirspaceRegion, label_en: overlaps airspace region, label_zh: 与空域区域重叠, definition_en: Relates an airspace corridor to an overlapping airspace region., definition_zh: 将空中航路关联到与其重叠的空域区域。, evidence: [global_entity_roster.json.entity_category=airspace_corridor]}

  - {id: hasEntityState, domain: "aw:Entity", range: EntityStateAtTick, label_en: has entity state, label_zh: 具有实体状态, definition_en: Relates a stable episode entity to a time-indexed objective state record., definition_zh: 将稳定 episode 实体关联到带时间索引的客观状态记录。, evidence: [truth_frames.jsonl.entities]}
  - {id: worldFrameOfEpisode, domain: WorldFrame, range: "aw:Episode", label_en: world frame of episode, label_zh: 世界帧所属 episode, definition_en: Relates a world frame to the episode whose objective state it records., definition_zh: 将世界帧关联到其所记录客观状态所属的 episode。, evidence: [truth_frames.jsonl.episode_id]}
  - {id: worldFrameAtInstant, domain: WorldFrame, range: "aw:TickInstant", label_en: world frame at instant, label_zh: 世界帧时刻, definition_en: Relates a world frame to its exact simulation tick instant., definition_zh: 将世界帧关联到其精确仿真 tick 时刻。, evidence: [truth_frames.jsonl.tick]}
  - {id: worldFrameUsesMap, domain: WorldFrame, range: OperationalMap, label_en: world frame uses map, label_zh: 世界帧使用地图, definition_en: Relates a world frame to the operational map in which its state is expressed., definition_zh: 将世界帧关联到表达其状态所使用的运行地图。, evidence: [truth_frames.jsonl.map_id]}
  - {id: worldFrameAtSite, domain: WorldFrame, range: Site, label_en: world frame at site, label_zh: 世界帧所在场地, definition_en: Relates a world frame to its active operational site., definition_zh: 将世界帧关联到其活动运行场地。, evidence: [truth_frames.jsonl.active_site_id]}
  - {id: worldFrameInRegionOfInterest, domain: WorldFrame, range: RegionOfInterest, label_en: world frame in region of interest, label_zh: 世界帧所在感兴趣区域, definition_en: Relates a world frame to its active region of interest., definition_zh: 将世界帧关联到其活动感兴趣区域。, evidence: [truth_frames.jsonl.active_roi_id]}
  - {id: worldFrameCaptureBoundary, domain: WorldFrame, range: CaptureBoundary, label_en: world frame capture boundary, label_zh: 世界帧采集边界, definition_en: Relates a world frame to its objective capture boundary., definition_zh: 将世界帧关联到其客观采集边界。, evidence: [truth_frames.jsonl.capture_boundary_id]}
  - {id: frameContainsEntityState, domain: WorldFrame, range: EntityStateAtTick, label_en: frame contains entity state, label_zh: 世界帧包含实体状态, definition_en: Relates a world frame to an entity state contained in that frame., definition_zh: 将世界帧关联到该帧包含的实体状态。, evidence: [truth_frames.jsonl.entities]}
  - {id: entityStateInFrame, domain: EntityStateAtTick, range: WorldFrame, label_en: entity state in frame, label_zh: 实体状态所属世界帧, definition_en: Relates an entity state to the world frame containing it., definition_zh: 将实体状态关联到包含它的世界帧。, evidence: [truth_frames.jsonl.entities]}
  - {id: stateOfEntity, domain: EntityStateAtTick, range: "aw:Entity", label_en: state of entity, label_zh: 所描述实体, definition_en: Identifies the stable entity described by a state record., definition_zh: 标识状态记录所描述的稳定实体。, evidence: [trajectories.jsonl.entity_id]}
  - {id: stateAtInstant, domain: EntityStateAtTick, range: "aw:TickInstant", label_en: state at instant, label_zh: 状态时刻, definition_en: Relates an entity state record to its exact simulation tick instant., definition_zh: 将实体状态记录关联到精确的仿真 tick 时刻。, evidence: [trajectories.jsonl.tick]}
  - {id: stateInRegion, domain: EntityStateAtTick, range: SpatialRegion, label_en: state in region, label_zh: 状态所在区域, definition_en: Relates an entity state to a spatial region containing its objective position., definition_zh: 将实体状态关联到包含其客观位置的空间区域。, evidence: [truth_frames.jsonl.entities.truth_pose.position_enu_m]}
  - {id: stateOnRoadLane, domain: EntityStateAtTick, range: RoadLane, label_en: state on road lane, label_zh: 状态所在车道, definition_en: Relates an entity state to the road lane occupied at that tick., definition_zh: 将实体状态关联到该 tick 所占用的道路车道。, evidence: [truth_frames.jsonl.entities.sumo_vehicle.sumo_lane_id]}
  - {id: stateInAirspaceCorridor, domain: EntityStateAtTick, range: AirspaceCorridor, label_en: state in airspace corridor, label_zh: 状态所在空中航路, definition_en: Relates an aircraft state to the airspace corridor occupied at that tick., definition_zh: 将航空器状态关联到该 tick 所在的空中航路。, evidence: [truth_frames.jsonl.entities.uav_corridor]}

  - {id: roadHasSegment, domain: Roadway, range: RoadSegment, label_en: road has segment, label_zh: 道路具有路段, definition_en: Relates a roadway to one of its constituent segments., definition_zh: 将道路关联到其组成路段。, evidence: [road.geojson.properties.id, lane_meta.csv.source_road_id]}
  - {id: segmentHasLane, domain: RoadSegment, range: RoadLane, label_en: segment has lane, label_zh: 路段具有车道, definition_en: Relates a road segment to one of its directed lanes., definition_zh: 将道路路段关联到其有向车道。, evidence: [lane_meta.csv.edge_id, lane_meta.csv.lane_id]}
  - {id: laneConnectsTo, domain: RoadLane, range: RoadLane, label_en: lane connects to, label_zh: 车道连接到, definition_en: Relates a directed road lane to an immediately reachable lane., definition_zh: 将有向道路车道关联到可直接到达的车道。, evidence: [lane_connections.csv]}
  - {id: roadMeetsAtIntersection, domain: RoadSegment, range: Intersection, label_en: road meets at intersection, label_zh: 路段交汇于路口, definition_en: Relates a road segment to an intersection it enters or leaves., definition_zh: 将道路路段关联到其进入或离开的路口。, evidence: [lane_connections.csv.via_lane]}
  - {id: controlsIntersection, domain: TrafficSignal, range: Intersection, label_en: controls intersection, label_zh: 控制路口, definition_en: Relates a traffic signal to the intersection it controls., definition_zh: 将交通信号灯关联到其控制的路口。, evidence: [truth_frames.jsonl.sumo_traffic_light_states]}
  - {id: pedestrianUsesCrosswalk, domain: Pedestrian, range: Crosswalk, label_en: pedestrian uses crosswalk, label_zh: 行人使用人行横道, definition_en: Relates a pedestrian to a crosswalk assigned to its movement., definition_zh: 将行人关联到其运动所使用的人行横道。, evidence: [global_entity_roster.json.semantic_role]}

  - {id: assignedToCorridor, domain: UnmannedAircraft, range: AirspaceCorridor, label_en: assigned to corridor, label_zh: 分配至航路, definition_en: Relates an aircraft to its assigned airspace corridor., definition_zh: 将航空器关联到其指定空中航路。, evidence: [global_entity_roster.json.uav_corridor_role]}
  - {id: assignedAltitudeBand, domain: UnmannedAircraft, range: AltitudeBand, label_en: assigned altitude band, label_zh: 指定高度层, definition_en: Relates an aircraft to its assigned altitude band., definition_zh: 将航空器关联到其指定高度层。, evidence: [truth_frames.jsonl.entities.assigned_altitude_m]}
  - {id: hasHomeLandingSite, domain: UnmannedAircraft, range: LandingSite, label_en: has home landing site, label_zh: 具有归航场地, definition_en: Relates an aircraft to its home or recovery landing site., definition_zh: 将航空器关联到其归航或恢复场地。, evidence: [global_entity_roster.json.uav_pad_id]}
  - {id: servedByStation, domain: UnmannedAircraft, range: CommunicationStation, label_en: served by station, label_zh: 由通信站服务, definition_en: Relates an aircraft to a communication station serving it., definition_zh: 将航空器关联到为其服务的通信站。, evidence: [global_entity_roster.json.semantic_role]}
  - {id: assignedChargingStation, domain: UnmannedAircraft, range: ChargingStation, label_en: assigned charging station, label_zh: 指定充电站, definition_en: Relates an aircraft to its assigned charging station., definition_zh: 将航空器关联到其指定充电站。, evidence: [global_entity_roster.json.entity_kind=facility.charger]}
  - {id: requestsUseOf, domain: UnmannedAircraft, range: InfrastructureAsset, label_en: requests use of, label_zh: 请求使用, definition_en: Relates an aircraft to an infrastructure resource it requests., definition_zh: 将航空器关联到其请求使用的基础设施资源。, evidence: [event_script.json.actions]}
  - {id: assignedResponderTo, domain: EmergencyResponder, range: HazardSource, label_en: assigned responder to, label_zh: 响应主体被指派至, definition_en: Relates an emergency responder to the hazard or incident it is assigned to., definition_zh: 将应急响应主体关联到其被指派处理的危险或事件。, evidence: [global_entity_roster.json.semantic_role]}
  - {id: landingOccursIn, domain: UnmannedAircraft, range: LandingArea, label_en: landing occurs in, label_zh: 降落发生于, definition_en: Relates an aircraft to the operational region of its landing., definition_zh: 将航空器关联到其降落所在的运行区域。, evidence: [truth_frames.jsonl.entities.state]}
  - {id: carriesPayload, domain: MobileAgent, range: Payload, label_en: carries payload, label_zh: 携带载荷, definition_en: Relates a mobile agent to a physical payload it carries., definition_zh: 将移动主体关联到其携带的物理载荷。, evidence: [global_entity_roster.json.entity_kind=prop.delivery_bag]}
  - {id: controlledBy, domain: UnmannedAircraft, range: GroundControlStation, label_en: controlled by, label_zh: 由地面控制站控制, definition_en: Relates an aircraft to its controlling ground control station., definition_zh: 将航空器关联到控制其运行的地面控制站。, evidence: [global_entity_roster.json.semantic_role]}

datatype_properties:
  - {id: logicalAssetIdentifier, domain: "aw:Entity", range: "xsd:string", label_en: logical asset identifier, label_zh: 逻辑资产标识, definition_en: The stable logical asset identifier assigned to an episode entity., definition_zh: 分配给 episode 实体的稳定逻辑资产标识。, evidence: [global_entity_roster.json.logical_asset_id], unitSymbol: "identifier", stateFieldCategory: "entity-identifier"}
  - {id: siteIdentifier, domain: Site, range: "xsd:string", label_en: site identifier, label_zh: 场地标识, definition_en: The stable site_id value used by episode artifacts., definition_zh: episode 制品使用的稳定 site_id 值。, evidence: [global_entity_roster.json.site_id], unitSymbol: "identifier", stateFieldCategory: "spatial-identifier"}
  - {id: regionOfInterestIdentifier, domain: RegionOfInterest, range: "xsd:string", label_en: region of interest identifier, label_zh: 感兴趣区域标识, definition_en: The stable roi_id value used by episode artifacts., definition_zh: episode 制品使用的稳定 roi_id 值。, evidence: [global_entity_roster.json.roi_id], unitSymbol: "identifier", stateFieldCategory: "spatial-identifier"}
  - {id: boundaryIdentifier, domain: SpatialBoundary, range: "xsd:string", label_en: boundary identifier, label_zh: 边界标识, definition_en: The stable capture_boundary_id value used by episode truth., definition_zh: episode 真值使用的稳定 capture_boundary_id 值。, evidence: [truth_frames.jsonl.capture_boundary_id], unitSymbol: "identifier", stateFieldCategory: "spatial-identifier"}
  - {id: mapIdentifier, domain: OperationalMap, range: "xsd:string", label_en: map identifier, label_zh: 地图标识, definition_en: The stable map_id value used by episode truth., definition_zh: episode 真值使用的稳定 map_id 值。, evidence: [truth_frames.jsonl.map_id], unitSymbol: "identifier", stateFieldCategory: "map-identifier"}
  - {id: frameIdentifier, domain: WorldFrame, range: "xsd:string", label_en: frame identifier, label_zh: 世界帧标识, definition_en: The stable frame_id value used by episode truth., definition_zh: episode 真值使用的稳定 frame_id 值。, evidence: [truth_frames.jsonl.frame_id], unitSymbol: "identifier", stateFieldCategory: "frame-identifier"}
  - {id: roadIdentifier, domain: Roadway, range: "xsd:string", label_en: road identifier, label_zh: 道路标识, definition_en: The stable source road identifier., definition_zh: 稳定的源道路标识。, evidence: [road.geojson.properties.id], unitSymbol: "identifier", stateFieldCategory: "road-identifier"}
  - {id: roadEdgeIdentifier, domain: RoadSegment, range: "xsd:string", label_en: road edge identifier, label_zh: 道路边标识, definition_en: The stable directed edge identifier used by road and SUMO truth., definition_zh: 道路与 SUMO 真值使用的稳定有向边标识。, evidence: [lane_meta.csv.edge_id], unitSymbol: "identifier", stateFieldCategory: "road-identifier"}
  - {id: roadLaneIdentifier, domain: RoadLane, range: "xsd:string", label_en: road lane identifier, label_zh: 道路车道标识, definition_en: The stable directed lane identifier used by road and SUMO truth., definition_zh: 道路与 SUMO 真值使用的稳定有向车道标识。, evidence: [lane_meta.csv.lane_id], unitSymbol: "identifier", stateFieldCategory: "road-identifier"}
  - {id: laneIndex, domain: RoadLane, range: "xsd:nonNegativeInteger", label_en: lane index, label_zh: 车道索引, definition_en: The zero-based lane index within a directed road edge., definition_zh: 有向道路边内从零开始的车道索引。, evidence: [lane_meta.csv.lane_index], unitSymbol: "1", stateFieldCategory: "topology-index"}
  - {id: laneWidthM, domain: RoadLane, range: "xsd:decimal", label_en: lane width in metres, label_zh: 车道宽度（米）, definition_en: The physical width of a road lane in metres., definition_zh: 道路车道的物理宽度，单位为米。, evidence: [lane_meta.csv.lane_width_m], unitSymbol: "m", stateFieldCategory: "topology-metric"}
  - {id: laneSpeedLimitMps, domain: RoadLane, range: "xsd:decimal", label_en: lane speed limit in metres per second, label_zh: 车道限速（米每秒）, definition_en: The lane speed value in metres per second., definition_zh: 车道速度值，单位为米每秒。, evidence: [lane_meta.csv.speed_mps], unitSymbol: "m/s", stateFieldCategory: "topology-metric"}

  - {id: positionEastM, domain: EntityStateAtTick, range: "xsd:decimal", label_en: east position in metres, label_zh: 东向位置（米）, definition_en: The east component of the objective ENU position in metres., definition_zh: 客观 ENU 位置的东向分量，单位为米。, evidence: ["truth_frames.jsonl.entities.truth_pose.position_enu_m[0]"], unitSymbol: "m", stateFieldCategory: "pose-position"}
  - {id: positionNorthM, domain: EntityStateAtTick, range: "xsd:decimal", label_en: north position in metres, label_zh: 北向位置（米）, definition_en: The north component of the objective ENU position in metres., definition_zh: 客观 ENU 位置的北向分量，单位为米。, evidence: ["truth_frames.jsonl.entities.truth_pose.position_enu_m[1]"], unitSymbol: "m", stateFieldCategory: "pose-position"}
  - {id: positionUpM, domain: EntityStateAtTick, range: "xsd:decimal", label_en: up position in metres, label_zh: 高程位置（米）, definition_en: The up component of the objective ENU position in metres., definition_zh: 客观 ENU 位置的高程分量，单位为米。, evidence: ["truth_frames.jsonl.entities.truth_pose.position_enu_m[2]"], unitSymbol: "m", stateFieldCategory: "pose-position"}
  - {id: velocityEastMps, domain: EntityStateAtTick, range: "xsd:decimal", label_en: east velocity in metres per second, label_zh: 东向速度（米每秒）, definition_en: The east component of objective ENU velocity., definition_zh: 客观 ENU 速度的东向分量。, evidence: ["truth_frames.jsonl.entities.truth_pose.velocity_enu_mps[0]"], unitSymbol: "m/s", stateFieldCategory: "pose-velocity"}
  - {id: velocityNorthMps, domain: EntityStateAtTick, range: "xsd:decimal", label_en: north velocity in metres per second, label_zh: 北向速度（米每秒）, definition_en: The north component of objective ENU velocity., definition_zh: 客观 ENU 速度的北向分量。, evidence: ["truth_frames.jsonl.entities.truth_pose.velocity_enu_mps[1]"], unitSymbol: "m/s", stateFieldCategory: "pose-velocity"}
  - {id: velocityUpMps, domain: EntityStateAtTick, range: "xsd:decimal", label_en: up velocity in metres per second, label_zh: 高程速度（米每秒）, definition_en: The up component of objective ENU velocity., definition_zh: 客观 ENU 速度的高程分量。, evidence: ["truth_frames.jsonl.entities.truth_pose.velocity_enu_mps[2]"], unitSymbol: "m/s", stateFieldCategory: "pose-velocity"}
  - {id: yawDeg, domain: EntityStateAtTick, range: "xsd:decimal", label_en: yaw in degrees, label_zh: 偏航角（度）, definition_en: The objective yaw angle in degrees., definition_zh: 客观偏航角，单位为度。, evidence: [truth_frames.jsonl.entities.truth_pose.rotation_deg.yaw_deg], unitSymbol: "deg", stateFieldCategory: "pose-orientation"}
  - {id: pitchDeg, domain: EntityStateAtTick, range: "xsd:decimal", label_en: pitch in degrees, label_zh: 俯仰角（度）, definition_en: The objective pitch angle in degrees., definition_zh: 客观俯仰角，单位为度。, evidence: [truth_frames.jsonl.entities.truth_pose.rotation_deg.pitch_deg], unitSymbol: "deg", stateFieldCategory: "pose-orientation"}
  - {id: rollDeg, domain: EntityStateAtTick, range: "xsd:decimal", label_en: roll in degrees, label_zh: 横滚角（度）, definition_en: The objective roll angle in degrees., definition_zh: 客观横滚角，单位为度。, evidence: [truth_frames.jsonl.entities.truth_pose.rotation_deg.roll_deg], unitSymbol: "deg", stateFieldCategory: "pose-orientation"}
  - {id: speedMps, domain: EntityStateAtTick, range: "xsd:decimal", label_en: speed in metres per second, label_zh: 速度（米每秒）, definition_en: The scalar objective speed in metres per second., definition_zh: 客观标量速度，单位为米每秒。, evidence: [truth_frames.jsonl.entities.annotations.speed_mps], unitSymbol: "m/s", stateFieldCategory: "motion-state"}
  - {id: accelerationMps2, domain: EntityStateAtTick, range: "xsd:decimal", label_en: acceleration in metres per second squared, label_zh: 加速度（米每二次方秒）, definition_en: The scalar longitudinal acceleration in metres per second squared., definition_zh: 纵向标量加速度，单位为米每二次方秒。, evidence: [truth_frames.jsonl.entities.sumo_vehicle.accel_mps2], unitSymbol: "m/s^2", stateFieldCategory: "motion-state"}
  - {id: activityType, domain: EntityStateAtTick, range: "xsd:string", label_en: activity type, label_zh: 活动类型, definition_en: The objective activity_type assigned to an entity at a tick., definition_zh: 在某一 tick 分配给实体的客观 activity_type。, evidence: [truth_frames.jsonl.entities.annotations.activity_type], unitSymbol: "state-code", stateFieldCategory: "activity-state"}
  - {id: operationalState, domain: EntityStateAtTick, range: "xsd:string", label_en: operational state, label_zh: 运行状态, definition_en: The objective discrete state assigned to an entity at a tick., definition_zh: 在某一 tick 分配给实体的客观离散状态。, evidence: [truth_frames.jsonl.entities.state], unitSymbol: "state-code", stateFieldCategory: "operational-state"}
  - {id: lanePositionM, domain: EntityStateAtTick, range: "xsd:decimal", label_en: lane position in metres, label_zh: 车道位置（米）, definition_en: The longitudinal position of a vehicle state along its road lane., definition_zh: 车辆状态沿其道路车道的纵向位置。, evidence: [truth_frames.jsonl.entities.sumo_vehicle.lane_position_m], unitSymbol: "m", stateFieldCategory: "road-state"}
  - {id: assignedAltitudeM, domain: UnmannedAircraft, range: "xsd:decimal", label_en: assigned altitude in metres, label_zh: 指定高度（米）, definition_en: The altitude assigned to an unmanned aircraft in metres., definition_zh: 分配给无人机的高度，单位为米。, evidence: [truth_frames.jsonl.entities.assigned_altitude_m], unitSymbol: "m", stateFieldCategory: "aircraft-assignment"}

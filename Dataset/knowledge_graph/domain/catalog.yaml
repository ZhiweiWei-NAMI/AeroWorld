      - key: aircraft
        class: UnmannedAircraft
      - key: flight_plan
        class: FlightPlan
    - id: OperationalIntentConflict
      identifier: utm.operational_intent_conflict
      label_en: operational intent conflict
      label_zh: 运行意图冲突
      definition_en: Holds when two operational intents overlap in space and time beyond the declared separation policy.
      definition_zh: 当两个运行意图在时空上重叠并超过声明的间隔策略时成立。
      roles:
      - key: first_intent
        class: OperationalIntent
      - key: second_intent
        class: OperationalIntent
    - id: DeconflictionActive

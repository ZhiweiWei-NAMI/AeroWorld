schema: aeroworld.world-truth-predicate-contracts.v3
version: 3.0.0
scope_types: [uav, vehicle, pedestrian, facility, compute_node, scene]
materialization: tick0_grounded_candidate_base_plus_add_set_remove_delta
predicate_execution:
  policy: explicit_partition_no_default
  executable_l1_predicate_ids:
  - airspace.aircraft_inside_restricted_airspace
  - airspace.aircraft_inside_protected_airspace
  - airspace.aircraft_is_non_cooperative
  - airspace.aircraft_outside_assigned_altitude_band
  - airspace.aircraft_occupies_airspace_corridor
  - airspace.aircraft_moving_in_corridor
  - airspace.aircraft_stationary_in_corridor
  - airspace.airspace_corridor_over_capacity
  - airspace.aircraft_airborne
  - airspace.aircraft_at_home_pad
  - airspace.aircraft_touchdown
  - airspace.aircraft_in_landing_zone
  - ground.vehicle_moving_in_lane
  - ground.vehicle_stopped_in_lane
  - ground.vehicle_queue_exceeds_length
  - ground.road_segment_closed
  - ground.pedestrian_in_crosswalk
  - ground.traffic_signal_malfunction_active
  - regulation.traffic_signal_applies_to_vehicle
  - regulation.vehicle_crosses_stop_line_on_red
  - regulation.vehicle_exceeds_posted_speed
  - regulation.vehicle_violates_following_distance
  - regulation.pedestrian_has_crosswalk_priority
  - safety.aircraft_pair_below_separation
  - safety.aircraft_near_building_structure
  - safety.aircraft_near_ground_vehicle
  - safety.aircraft_near_pedestrian
  - safety.vehicle_pedestrian_conflict
  - safety.crowd_evacuation_active
  - facility.aircraft_battery_low
  - facility.charging_station_unavailable
  - facility.charging_queue_over_capacity
  - facility.landing_pad_occupied
  - facility.landing_pad_contention
  - communication.link_unavailable
  - communication.link_degraded
  - communication.message_transmission_failed
  - communication.channel_bandwidth_over_allocated
  - communication.communication_session_interrupted
  - communication.handover_in_progress
  - communication.data_flow_latency_above_threshold
  - communication.packet_loss_above_threshold
  - communication.retransmission_in_progress
  - compute.compute_node_unavailable
  - compute.compute_task_queued
  - compute.compute_resource_over_allocated
  - compute.compute_task_offloaded
  - compute.compute_task_migrating
  - compute.compute_task_execution_failed
  - compute.compute_task_deadline_missed
  - positioning.gnss_quality_degraded
  - positioning.gnss_spoofing_active
  - positioning.navigation_error_exceeds_tolerance
  - positioning.aircraft_deviates_from_planned_route
  - environment.rain_active
  - environment.fog_active
  - environment.visibility_below_threshold
  - environment.wind_speed_above_threshold
  - environment.low_illumination_active
  - environment.temperature_outside_operating_range
  - security.ground_control_station_compromised
  - security.communication_jamming_impact_active
  - emergency.temporary_no_fly_zone_active
  - emergency.emergency_isolation_active
  - emergency.aircraft_in_return_to_home
  - emergency.mission_aborted
  - emergency.aircraft_in_safe_hold
  - utm.airspace_authorization_active
  - utm.airspace_authorization_revoked
  - utm.flight_plan_approved
  - utm.operational_intent_conflict
  - utm.deconfliction_active
  non_executable_predicates:
    safety.forced_landing_in_populated_area:
      reason_code: missing_populated_area_individual_authority
      missing_authorities:
      - {kind: ontology_role_individual, ontology_class: PopulatedArea}
      closure_statement: No L0 producer materializes a real, typed PopulatedArea individual; pedestrian or vehicle identifiers must not be relabeled as areas.
    security.unauthorized_command_received:
      reason_code: missing_unauthorized_command_individual_authority
      missing_authorities:
      - {kind: ontology_role_individual, ontology_class: UnauthorizedCommand}
      closure_statement: Command-source validity is state evidence only; no L0 producer materializes a typed UnauthorizedCommand individual.
    security.security_control_unavailable:
      reason_code: missing_cyber_security_control_individual_authority
      missing_authorities:
      - {kind: ontology_role_individual, ontology_class: CyberSecurityControl}
      closure_statement: Lockout state is not a CyberSecurityControl individual, and no L0 producer materializes that required participant.
    security.control_command_integrity_violated:
      reason_code: missing_command_stream_individual_authority
      missing_authorities:
      - {kind: ontology_role_individual, ontology_class: CommandStream}
      closure_statement: Command-integrity state is not a CommandStream individual, and no L0 producer materializes that required participant.
    emergency.evacuation_in_progress:
      reason_code: missing_evacuation_route_individual_authority
      missing_authorities:
      - {kind: ontology_role_individual, ontology_class: EvacuationRoute}
      closure_statement: Crowd evacuation state exists, but no L0 producer materializes a real, typed EvacuationRoute participant.
    emergency.emergency_vehicle_priority_active:
      reason_code: missing_ambulance_priority_passage_individual_authority
      missing_authorities:
      - {kind: ontology_role_individual, ontology_class: AmbulancePriorityPassage}
      - {kind: supporting_individual, ontology_class: EmergencyResponse}
      closure_statement: Typed ambulance and right-of-way state do not materialize the required AmbulancePriorityPassage or EmergencyResponse lifecycle individual.
    regulation.vehicle_violates_right_of_way:
      reason_code: missing_right_of_way_state_authority
      missing_authorities:
      - {kind: runtime_state_field, field: vehicle_state.right_of_way_state}
      closure_statement: SUMO materializes typed RightOfWay identities for controlled connections, but no scenario or physical producer materializes a nominal or violation state for a bound vehicle and RightOfWay tuple.
predicates:
  airspace.aircraft_inside_restricted_airspace:
    tuple_type: aircraft_restricted_region
    scope_types: [uav]
    fields:
    - [geometry.restricted_region_active, derived/plan_window_computer, bool]
    - [geometry.minimum_restricted_boundary_distance_m, derived/geometric_computer, m]
    thresholds: [boundary_margin_m]
    evaluation: {op: all, args: [{op: truthy, field: geometry.restricted_region_active}, {op: lte, field: geometry.minimum_restricted_boundary_distance_m, threshold: boundary_margin_m}]}
    expression: region_active AND signed_distance_to_boundary_m <= boundary_margin_m
  airspace.aircraft_inside_protected_airspace:
    tuple_type: world_scope
    scope_types: [uav]
    fields:
    - [geometry.inside_protected_airspace, derived/geometric_computer, bool]
    evaluation: {op: truthy, field: geometry.inside_protected_airspace}
    expression: inside_protected_airspace
  airspace.aircraft_is_non_cooperative:
    tuple_type: aircraft
    scope_types: [uav]
    fields:
    - [plan.cooperative_flag, derived/plan_window_computer, bool]
    evaluation: {op: falsy, field: plan.cooperative_flag}
    expression: NOT cooperative_flag
  airspace.aircraft_outside_assigned_altitude_band:
    tuple_type: aircraft
    scope_types: [uav]
    fields:
    - [geometry.position_z_m, derived/geometric_computer, m]
    - [geometry.assigned_altitude_m, derived/geometric_computer, m]
    thresholds: [altitude_tolerance_m]
    evaluation: {op: absolute_difference_gt, left: geometry.position_z_m, right: geometry.assigned_altitude_m, threshold: altitude_tolerance_m}
    expression: abs(position_z_m - assigned_altitude_m) > altitude_tolerance_m
  airspace.aircraft_occupies_airspace_corridor:
    tuple_type: aircraft_corridor
    scope_types: [uav]
    fields:
    - [geometry.aircraft_inside_corridor, derived/geometric_computer, bool]
    evaluation: {op: truthy, field: geometry.aircraft_inside_corridor}
    expression: aircraft_inside_corridor
  airspace.aircraft_moving_in_corridor:
    tuple_type: world_scope
    scope_types: [uav]
    fields:
    - [geometry.aircraft_inside_corridor, derived/geometric_computer, bool]
    - [geometry.speed_mps, derived/geometric_computer, m/s]
    thresholds: [aircraft_stationary_speed_threshold_mps]
    evaluation: {op: all, args: [{op: truthy, field: geometry.aircraft_inside_corridor}, {op: gt, field: geometry.speed_mps, threshold: aircraft_stationary_speed_threshold_mps}]}
    expression: aircraft_inside_corridor AND speed_mps > aircraft_stationary_speed_threshold_mps
  airspace.aircraft_stationary_in_corridor:
    tuple_type: world_scope
    scope_types: [uav]
    fields:
    - [geometry.aircraft_inside_corridor, derived/geometric_computer, bool]
    - [geometry.speed_mps, derived/geometric_computer, m/s]
    thresholds: [aircraft_stationary_speed_threshold_mps]
    evaluation: {op: all, args: [{op: truthy, field: geometry.aircraft_inside_corridor}, {op: lte, field: geometry.speed_mps, threshold: aircraft_stationary_speed_threshold_mps}]}
    expression: aircraft_inside_corridor AND speed_mps <= aircraft_stationary_speed_threshold_mps
  airspace.airspace_corridor_over_capacity:
    tuple_type: corridor
    scope_types: [scene]
    fields:
    - [scene.maximum_corridor_occupancy_count, derived/geometric_computer, aircraft]
    - [scene.maximum_corridor_capacity, derived/geometric_computer, aircraft]
    evaluation: {op: gt_fields, left: scene.maximum_corridor_occupancy_count, right: scene.maximum_corridor_capacity}
    expression: maximum_corridor_occupancy_count > maximum_corridor_capacity
  airspace.aircraft_airborne:
    tuple_type: aircraft
    scope_types: [uav]
    fields:
    - [geometry.z_agl_m, derived/geometric_computer, m]
    - [geometry.local_ground_reference_z_m, derived/geometric_computer, m]
    thresholds: [airborne_threshold_m]
    evaluation: {op: gt, field: geometry.z_agl_m, threshold: airborne_threshold_m}
    expression: local-ground z_agl_m > airborne_threshold_m
  airspace.aircraft_at_home_pad:
    tuple_type: aircraft_home_pad
    scope_types: [uav]
    fields:
    - [geometry.xy_distance_to_home_pad_m, derived/geometric_computer, m]
    - [geometry.home_pad_id, derived/geometric_computer, identifier]
    thresholds: [home_pad_radius_m]
    evaluation: {op: lte, field: geometry.xy_distance_to_home_pad_m, threshold: home_pad_radius_m}
    expression: xy_distance_to_home_pad_m <= home_pad_radius_m
  airspace.aircraft_touchdown:
    tuple_type: aircraft
    scope_types: [uav]
    fields:
    - [geometry.z_agl_m, derived/geometric_computer, m]
    - [geometry.speed_mps, derived/geometric_computer, m/s]
    thresholds: [touchdown_threshold_m, aircraft_stationary_speed_threshold_mps]
    evaluation: {op: all, args: [{op: lte, field: geometry.z_agl_m, threshold: touchdown_threshold_m}, {op: lte, field: geometry.speed_mps, threshold: aircraft_stationary_speed_threshold_mps}]}
    expression: z_agl_m <= touchdown_threshold_m AND speed_mps <= aircraft_stationary_speed_threshold_mps
  airspace.aircraft_in_landing_zone:
    tuple_type: aircraft_landing_zone
    scope_types: [uav]
    fields:
    - [geometry.xy_distance_to_assigned_landing_zone_m, derived/geometric_computer, m]
    - [geometry.assigned_landing_zone_id, derived/geometric_computer, identifier]
    thresholds: [landing_zone_radius_m]
    evaluation: {op: lte, field: geometry.xy_distance_to_assigned_landing_zone_m, threshold: landing_zone_radius_m}
    expression: xy_distance_to_assigned_landing_zone_m <= landing_zone_radius_m

  ground.vehicle_moving_in_lane:
    tuple_type: world_scope
    scope_types: [vehicle]
    fields:
    - [truth.lane_id, truth/truth_frames.jsonl, identifier]
    - [truth.speed_mps, truth/truth_frames.jsonl, m/s]
    thresholds: [vehicle_stopped_speed_threshold_mps]
    evaluation: {op: all, args: [{op: present, field: truth.lane_id}, {op: gt, field: truth.speed_mps, threshold: vehicle_stopped_speed_threshold_mps}]}
    expression: lane_id is present AND speed_mps > vehicle_stopped_speed_threshold_mps
  ground.vehicle_stopped_in_lane:
    tuple_type: world_scope
    scope_types: [vehicle]
    fields:
    - [truth.lane_id, truth/truth_frames.jsonl, identifier]
    - [truth.speed_mps, truth/truth_frames.jsonl, m/s]
    thresholds: [vehicle_stopped_speed_threshold_mps]
    evaluation: {op: all, args: [{op: present, field: truth.lane_id}, {op: lte, field: truth.speed_mps, threshold: vehicle_stopped_speed_threshold_mps}]}
    expression: lane_id is present AND speed_mps <= vehicle_stopped_speed_threshold_mps
  ground.vehicle_queue_exceeds_length:
    tuple_type: world_scope
    scope_types: [scene]
    fields:
    - [domain.signal_queue.queue_vehicle_count, domain_state_supplement/domain_state_observations.jsonl, vehicle]
    thresholds: [queue_length_threshold_vehicles]
    evaluation: {op: gt, field: domain.signal_queue.queue_vehicle_count, threshold: queue_length_threshold_vehicles}
    expression: queue_vehicle_count > queue_length_threshold_vehicles
  ground.road_segment_closed:
    tuple_type: world_scope
    scope_types: [scene]
    fields:
    - [domain.road_closure.road_closed, domain_state_supplement/domain_state_observations.jsonl, bool]
    evaluation: {op: truthy, field: domain.road_closure.road_closed}
    expression: road_closed
  ground.pedestrian_in_crosswalk:
    tuple_type: world_scope
    scope_types: [pedestrian]
    fields:
    - [truth.in_crosswalk, truth/truth_frames.jsonl, bool]
    evaluation: {op: truthy, field: truth.in_crosswalk}
    expression: in_crosswalk
  ground.traffic_signal_malfunction_active:
    tuple_type: world_scope
    scope_types: [scene]
    fields:
    - [domain.signal_queue.controller_health, domain_state_supplement/domain_state_observations.jsonl, state-code]
    evaluation: {op: equals, field: domain.signal_queue.controller_health, value: all_red_fault}
    expression: controller_health = all_red_fault

  regulation.traffic_signal_applies_to_vehicle:
    tuple_type: world_scope
    scope_types: [vehicle]
    fields:
    - [truth.controlling_signal_id, truth/truth_frames.jsonl, identifier]
    evaluation: {op: present, field: truth.controlling_signal_id}
    expression: controlling_signal_id is present
  regulation.vehicle_crosses_stop_line_on_red:
    tuple_type: world_scope
    scope_types: [vehicle]
    fields:
    - [truth.crossed_stop_line, truth/truth_frames.jsonl, bool]
    - [truth.controlling_signal_state, truth/truth_frames.jsonl, state-code]
    evaluation: {op: all, args: [{op: truthy, field: truth.crossed_stop_line}, {op: equals, field: truth.controlling_signal_state, value: red}]}
    expression: crossed_stop_line AND controlling_signal_state = red
  regulation.vehicle_exceeds_posted_speed:
    tuple_type: world_scope
    scope_types: [vehicle]
    fields:
    - [truth.speed_mps, truth/truth_frames.jsonl, m/s]
    - [truth.posted_speed_limit_mps, truth/truth_frames.jsonl, m/s]
    evaluation: {op: gt_fields, left: truth.speed_mps, right: truth.posted_speed_limit_mps}
    expression: speed_mps > posted_speed_limit_mps
  regulation.vehicle_violates_right_of_way:
    tuple_type: world_scope
    scope_types: [vehicle]
    expression: right_of_way_state = violation
  regulation.vehicle_violates_following_distance:
    tuple_type: world_scope
    scope_types: [vehicle]
    fields:
    - [truth.following_distance_m, truth/truth_frames.jsonl#sumo_vehicle.following_distance_m, m]
    thresholds: [following_distance_threshold_m]
    evaluation: {op: lt, field: truth.following_distance_m, threshold: following_distance_threshold_m}
    expression: following_distance_m < following_distance_threshold_m
  regulation.pedestrian_has_crosswalk_priority:
    tuple_type: world_scope
    scope_types: [pedestrian]
    fields:
    - [truth.in_crosswalk, truth/truth_frames.jsonl, bool]
    evaluation: {op: truthy, field: truth.in_crosswalk}
    expression: in_crosswalk

  safety.aircraft_pair_below_separation:
    tuple_type: aircraft_pair
    scope_types: [uav]
    fields:
    - [derived.nearest_aircraft_distance_m, derived/geometric_computer, m]
    thresholds: [separation_margin_m]
    evaluation: {op: lt, field: derived.nearest_aircraft_distance_m, threshold: separation_margin_m}
    expression: nearest_aircraft_distance_m < separation_margin_m
  safety.aircraft_near_building_structure:
    tuple_type: world_scope
    scope_types: [uav]
    fields:
    - [derived.nearest_building_distance_m, derived/geometric_computer, m]
    thresholds: [safety_near_structure_m]
    evaluation: {op: lt, field: derived.nearest_building_distance_m, threshold: safety_near_structure_m}
    expression: nearest_building_distance_m < safety_near_structure_m
  safety.aircraft_near_ground_vehicle:
    tuple_type: world_scope
    scope_types: [uav]
    fields:
    - [derived.nearest_ground_vehicle_distance_m, derived/geometric_computer, m]
    thresholds: [safety_near_vehicle_m]
    evaluation: {op: lt, field: derived.nearest_ground_vehicle_distance_m, threshold: safety_near_vehicle_m}
    expression: nearest_ground_vehicle_distance_m < safety_near_vehicle_m
  safety.aircraft_near_pedestrian:
    tuple_type: world_scope
    scope_types: [uav]
    fields:
    - [derived.nearest_pedestrian_distance_m, derived/geometric_computer, m]
    thresholds: [safety_near_pedestrian_m]
    evaluation: {op: lt, field: derived.nearest_pedestrian_distance_m, threshold: safety_near_pedestrian_m}
    expression: nearest_pedestrian_distance_m < safety_near_pedestrian_m
  safety.vehicle_pedestrian_conflict:
    tuple_type: world_scope
    scope_types: [vehicle]
    fields:
    - [derived.nearest_pedestrian_distance_m, derived/geometric_computer, m]
    thresholds: [vehicle_pedestrian_conflict_m]
    evaluation: {op: lt, field: derived.nearest_pedestrian_distance_m, threshold: vehicle_pedestrian_conflict_m}
    expression: nearest_pedestrian_distance_m < vehicle_pedestrian_conflict_m
  safety.crowd_evacuation_active:
    tuple_type: world_scope
    scope_types: [scene]
    fields:
    - [domain.crowd_evacuation.evacuation_active, domain_state_supplement/domain_state_observations.jsonl, bool]
    evaluation: {op: truthy, field: domain.crowd_evacuation.evacuation_active}
    expression: evacuation_active
  safety.forced_landing_in_populated_area:
    tuple_type: world_scope
    scope_types: [uav]
    expression: forced landing occurs within a real typed PopulatedArea

  facility.aircraft_battery_low:
    tuple_type: world_scope
    scope_types: [uav]
    fields:
    - [domain.payload_energy.state_of_charge_ratio, domain_state_supplement/domain_state_observations.jsonl, ratio]
    thresholds: [battery_low_ratio]
    evaluation: {op: lt, field: domain.payload_energy.state_of_charge_ratio, threshold: battery_low_ratio}
    expression: state_of_charge_ratio < battery_low_ratio
  facility.charging_station_unavailable:
    tuple_type: world_scope
    scope_types: [facility]
    fields:
    - [domain.pad_facility.availability, domain_state_supplement/domain_state_observations.jsonl, state-code]
    evaluation: {op: equals, field: domain.pad_facility.availability, value: unavailable}
    expression: availability = unavailable
  facility.charging_queue_over_capacity:
    tuple_type: world_scope
    scope_types: [facility]
    fields:
    - [domain.pad_facility.requester_count, domain_state_supplement/domain_state_observations.jsonl, aircraft]
    - [domain.pad_facility.capacity, domain_state_supplement/domain_state_observations.jsonl, aircraft]
    evaluation: {op: gt_fields, left: domain.pad_facility.requester_count, right: domain.pad_facility.capacity}
    expression: requester_count > capacity
  facility.landing_pad_occupied:
    tuple_type: world_scope
    scope_types: [facility]
    fields:
    - [domain.pad_facility.occupied, domain_state_supplement/domain_state_observations.jsonl, bool]
    evaluation: {op: truthy, field: domain.pad_facility.occupied}
    expression: occupied
  facility.landing_pad_contention:
    tuple_type: world_scope
    scope_types: [facility]
    fields:
    - [domain.pad_facility.pair_contention, domain_state_supplement/domain_state_observations.jsonl, bool]
    evaluation: {op: truthy, field: domain.pad_facility.pair_contention}
    expression: both aircraft are simultaneous requesters for the same landing pad

  communication.link_unavailable: &communication_direct
    tuple_type: world_scope
    scope_types: [uav]
    fields:
    - [direct_predicate_value, compute_comm_supplement/predicate_truth.jsonl, four-value]
    evaluation: {op: direct_truth, field: direct_predicate_value}
    expression: compute/communication governed predicate value
  communication.link_degraded: *communication_direct
  communication.message_transmission_failed: *communication_direct
  communication.channel_bandwidth_over_allocated: *communication_direct
  communication.communication_session_interrupted: *communication_direct
  communication.handover_in_progress: *communication_direct
  communication.data_flow_latency_above_threshold: *communication_direct
  communication.packet_loss_above_threshold: *communication_direct
  communication.retransmission_in_progress: *communication_direct

  compute.compute_node_unavailable: &compute_direct
    tuple_type: world_scope
    scope_types: [compute_node]
    fields:
    - [direct_predicate_value, compute_comm_supplement/predicate_truth.jsonl, four-value]
    evaluation: {op: direct_truth, field: direct_predicate_value}
    expression: compute/communication governed predicate value
  compute.compute_task_queued: *compute_direct
  compute.compute_resource_over_allocated: *compute_direct
  compute.compute_task_offloaded: *compute_direct
  compute.compute_task_migrating: *compute_direct
  compute.compute_task_execution_failed: *compute_direct
  compute.compute_task_deadline_missed: *compute_direct

  positioning.gnss_quality_degraded:
    tuple_type: world_scope
    scope_types: [uav]
    fields:
    - [domain.gnss_navigation.quality_level, domain_state_supplement/domain_state_observations.jsonl, state-code]
    evaluation: {op: in, field: domain.gnss_navigation.quality_level, values: [degraded, spoofing_suspect]}
    expression: quality_level in {degraded, spoofing_suspect}
  positioning.gnss_spoofing_active:
    tuple_type: world_scope
    scope_types: [uav]
    fields:
    - [domain.gnss_navigation.gnss_spoofed, domain_state_supplement/domain_state_observations.jsonl, bool]
    evaluation: {op: truthy, field: domain.gnss_navigation.gnss_spoofed}
    expression: the governed SpoofingSignal actively affects the aircraft
  positioning.navigation_error_exceeds_tolerance:
    tuple_type: world_scope
    scope_types: [uav]
    fields:
    - [domain.gnss_navigation.position_error_m, domain_state_supplement/domain_state_observations.jsonl, m]
    thresholds: [gnss_error_tolerance_m]
    evaluation: {op: gt, field: domain.gnss_navigation.position_error_m, threshold: gnss_error_tolerance_m}
    expression: position_error_m > gnss_error_tolerance_m
  positioning.aircraft_deviates_from_planned_route:
    tuple_type: world_scope
    scope_types: [uav]
    fields:
    - [navigation.path_deviation, derived/control_response_state, bool]
    evaluation: {op: truthy, field: navigation.path_deviation}
    expression: path_deviation

  environment.rain_active:
    tuple_type: world_scope
    scope_types: [scene]
    fields:
    - [weather.rain, truth/weather_meta.jsonl, ratio]
    thresholds: [rain_active_threshold]
    evaluation: {op: gt, field: weather.rain, threshold: rain_active_threshold}
    expression: rain > rain_active_threshold
  environment.fog_active:
    tuple_type: world_scope
    scope_types: [scene]
    fields:
    - [weather.fog_density, truth/weather_meta.jsonl, ratio]
    thresholds: [fog_density_threshold]
    evaluation: {op: gt, field: weather.fog_density, threshold: fog_density_threshold}
    expression: fog_density > fog_density_threshold
  environment.visibility_below_threshold:
    tuple_type: world_scope
    scope_types: [scene]
    fields:
    - [weather.visibility_m, truth/weather_meta.jsonl, m]
    thresholds: [visibility_threshold_m]
    evaluation: {op: lt, field: weather.visibility_m, threshold: visibility_threshold_m}
    expression: visibility_m < visibility_threshold_m
  environment.wind_speed_above_threshold:
    tuple_type: world_scope
    scope_types: [scene]
    fields:
    - [weather.wind_speed, truth/weather_meta.jsonl, m/s]
    thresholds: [wind_speed_threshold_mps]

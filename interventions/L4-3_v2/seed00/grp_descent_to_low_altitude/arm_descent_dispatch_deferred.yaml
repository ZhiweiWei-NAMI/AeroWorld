  roster: "aw_data/render_ready_episodes_capture_filtered/L4-3_v2__seed00/global_entity_roster.json"
  event_realization: "aw_data/render_ready_episodes_capture_filtered/L4-3_v2__seed00/event_realization.jsonl"

  trigger_rewrites:
    - trigger_id: "trig_after_forced_landing_fault_delay_30"
      mechanism: "fired_after_delay_shift"
      delay_ticks: 15
expected:
  target_event: "observe"
  rationale: "event_fired_after 源 delay=30，重写 +15 → new_delay=45，引擎执行 父事件 fire(230)+45：descent_to_low_altitude dispatch 275，仅向更晚方向平移；260~274 UAV 保持 30 m 巡航末点，crowd_proximity_response 约 325（推导）、touchdown 约 375；全程故障补丁与撤离行为保持源值，仅相位推迟。"
  falsified_if: "descent_to_low_altitude 的 dispatch tick 不等于 275，或窗口内出现 275 之前的下降移动。"
script: "scripts/arms/L4-3_v2/seed00/grp_descent_to_low_altitude/arm_descent_dispatch_deferred.py"
output: "arms/L4-3_v2/seed00/grp_descent_to_low_altitude/arm_descent_dispatch_deferred"
provenance:
  experiment_ref: "design/L4-3_v2/seed00/grp_descent_to_low_altitude/experiment.json"
  parameter_sources:
    factual_root: "aw_data"
    trigger_rewrite: "design schedule_rewrites 意图为 descent dispatch 275（较 factual 推迟 15 tick）。引擎语义为 new_delay=源30+重写值，故执行 delay_ticks 15（1..60 内）：父事件 forced_landing_fault@230 + 45 = 275，与 design 预期 dispatch 一致"

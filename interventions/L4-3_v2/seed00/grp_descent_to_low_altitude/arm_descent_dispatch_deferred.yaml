  - "airspace.aircraft_in_landing_zone"
  - "emergency.mission_aborted"
  - "safety.forced_landing_in_populated_area"
window:
  start_tick: 255
  fork_tick: 260
  end_tick: 400
  phase: "after_state_sample_before_actions"
  intervention_order: "source_actions_then_intervention"
sources:

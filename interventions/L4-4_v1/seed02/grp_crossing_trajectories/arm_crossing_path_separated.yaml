schema: aeroworld_l4_window_config
version: 1
arm_id: arm_crossing_path_separated
group_key: L4-4_v1/seed02/grp_crossing_trajectories
episode_id: L4-4_v1__seed02
event_family: l4_uav_vehicle_contact_observed
subject_class: uav
mode: intervention
entity_ids:
- uav_falls_vehicle_l4_4_v1
- car_under_uav_l4_4_v1
predicate_ids:
- l4_business.uav_vehicle_proximity
- l4_business.uav_vehicle_contact
- l4_business.uav_damaged
- l4_business.uav_airborne
- l4_business.vehicle_emergency_stop_active
- l4_business.vehicle_physically_stopped
window:
  start_tick: 235
  fork_tick: 240
  end_tick: 700
  phase: after_state_sample_before_actions
  intervention_order: source_actions_then_intervention
sources:
  scene: Dataset/scenarios/L4_agents/collision/L4-4_v1/scene_setup.json
  script: Dataset/scenarios/L4_agents/collision/L4-4_v1/event_script.json
  trajectories: aw_data/render_ready_episodes_capture_filtered/L4-4_v1__seed02/trajectories.jsonl
  weather: aw_data/render_ready_episodes_capture_filtered/L4-4_v1__seed02/weather_meta.jsonl
  roster: aw_data/render_ready_episodes_capture_filtered/L4-4_v1__seed02/global_entity_roster.json
  event_realization: aw_data/render_ready_episodes_capture_filtered/L4-4_v1__seed02/event_realization.jsonl
  predicate_transitions: aw_data/objective_semantic_truth/L4-4_v1__seed02/predicate_transitions.jsonl
  event_outcomes: aw_data/objective_semantic_truth/L4-4_v1__seed02/event_outcomes.jsonl
execution:
  omit_action_ids:
  - move_uav_falling_cross
  actions:
  - tick: 240
    action:
      type: move_entity
      action_id: arm_crossing_path_separated_move_uav
      entity_id: uav_falls_vehicle_l4_4_v1
      velocity_mps: 6.0
      waypoints_enu_m:
      - - 6799.312
        - 8017.793
        - 20.0
      - - 6818.618
        - 8017.928
        - 20.0
      - - 6837.923
        - 8018.064
        - 20.0
      - - 6837.923
        - 8018.064
        - 36.0
      - - 6852.349
        - 8018.235
        - 36.0
      - &id001
        - 6852.349
        - 8018.235
        - 3.0
      terminal_feasibility:
        model: constant_speed_path_with_explicit_landing_reference_v2
        landing_reference_enu_m: *id001
        home_pose_origin_z_m: 3.0
        touchdown_altitude_tolerance_m: 1.5
        touchdown_dwell_ticks: 5
        max_speed_mps: 8.0
  trigger_rewrites: []
expected:
  target_event: observe
  rationale: 'Raise the crossing leg above the vehicle envelope and keep the mission: the UAV crosses clear, returns to the pad and lands. The 3D separation
    never reaches the contact radius, so no contact, no damage and no vehicle response occur. uav_vehicle_proximity and uav_vehicle_contact stay false;
    uav_damaged false; the vehicle never declares emergency_stop; the UAV reaches return_to_pad and lands inside the window.'
  falsified_if: any measured 3D separation at or below the contact radius, or uav_damaged true, or the vehicle declares emergency_stop, or the UAV does
    not land inside the window.
script: scripts/arms/L4-4_v1/seed02/grp_crossing_trajectories/arm_crossing_path_separated.py
output: arms/L4-4_v1/seed02/grp_crossing_trajectories/arm_crossing_path_separated
provenance:
  experiment_ref: design/L4-4_v1/seed02/grp_crossing_trajectories/experiment.json
  parameter_sources:
    factual_root: aw_data
    business_rules: Dataset/semantic_rules/profiles/l4_arm_business_semantics.json
    runtime_state_schedule: Dataset/semantic_rules/profiles/epi_runtime_state_schedules/l4_runtime_state_schedule.json
    window: design window (start/fork/end on the 5-tick formal grid)

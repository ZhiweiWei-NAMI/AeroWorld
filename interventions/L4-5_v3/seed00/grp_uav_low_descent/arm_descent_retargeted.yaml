schema: aeroworld_l4_window_config
version: 1
arm_id: arm_descent_retargeted
group_key: L4-5_v3/seed00/grp_uav_low_descent
episode_id: L4-5_v3__seed00
event_family: l4_uav_pedestrian_clearance_observed
subject_class: uav
mode: intervention
entity_ids:
- uav_ped_nearmiss_l4_5_v3
- ped_nearmiss_l4_5_v3
predicate_ids:
- l4_business.uav_low_altitude
- l4_business.aircraft_near_pedestrian
- l4_business.landing_zone_occupied
- l4_business.pedestrian_clear_of_landing_zone
- l4_business.uav_hold_active
- l4_business.uav_landed
window:
  start_tick: 225
  fork_tick: 230
  end_tick: 780
  phase: after_state_sample_before_actions
  intervention_order: source_actions_then_intervention
sources:
  scene: Dataset/scenarios/L4_agents/collision/L4-5_v3/scene_setup.json
  script: Dataset/scenarios/L4_agents/collision/L4-5_v3/event_script.json
  trajectories: aw_data/render_ready_episodes_capture_filtered/L4-5_v3__seed00/trajectories.jsonl
  weather: aw_data/render_ready_episodes_capture_filtered/L4-5_v3__seed00/weather_meta.jsonl
  roster: aw_data/render_ready_episodes_capture_filtered/L4-5_v3__seed00/global_entity_roster.json
  event_realization: aw_data/render_ready_episodes_capture_filtered/L4-5_v3__seed00/event_realization.jsonl
  predicate_transitions: aw_data/objective_semantic_truth/L4-5_v3__seed00/predicate_transitions.jsonl
  event_outcomes: aw_data/objective_semantic_truth/L4-5_v3__seed00/event_outcomes.jsonl
execution:
  omit_action_ids:
  - move_uav_ped_descent
  actions:
  - tick: 230
    action:
      type: move_entity
      action_id: arm_descent_retargeted_move_uav
      entity_id: uav_ped_nearmiss_l4_5_v3
      velocity_mps: 4.5
      waypoints_enu_m:
      - - 6644.932
        - 6513.617
        - 30.0
      - - 6645.629
        - 6505.648
        - 15.0
      - - 6634.326
        - 6497.678
        - 5.0
  - tick: 400
    action:
      type: move_entity
      action_id: arm_descent_retargeted_land_uav
      entity_id: uav_ped_nearmiss_l4_5_v3
      velocity_mps: 2.0
      waypoints_enu_m:
      - - 6634.326
        - 6497.678
        - 5.0
      - - 6634.326
        - 6497.678
        - 3.0
      terminal_feasibility:
        model: constant_speed_path_with_explicit_landing_reference_v2
        landing_reference_enu_m:
        - 6634.326
        - 6497.678
        - 3.0
        home_pose_origin_z_m: 3.0
        touchdown_altitude_tolerance_m: 1.5
        touchdown_dwell_ticks: 5
        max_speed_mps: 8.0
  trigger_rewrites: []
expected:
  target_event: observe
  rationale: At tick 230 replace the source descent with a destination 12 m to the west; from the next state sample the executed target defines the 8 m
    zone. Inject the final descent at tick 400. Expect no local near-pedestrian event and physical touchdown at that target. Before dispatch, retain the
    same source-target zone as factual.
  falsified_if: aircraft_near_pedestrian becomes true, or the UAV never reaches low altitude, or it does not land inside the window.
script: scripts/arms/L4-5_v3/seed00/grp_uav_low_descent/arm_descent_retargeted.py
output: arms/L4-5_v3/seed00/grp_uav_low_descent/arm_descent_retargeted
provenance:
  experiment_ref: design/L4-5_v3/seed00/grp_uav_low_descent/experiment.json
  parameter_sources:
    factual_root: aw_data
    business_rules: Dataset/semantic_rules/profiles/l4_arm_business_semantics.json
    runtime_state_schedule: Dataset/semantic_rules/profiles/epi_runtime_state_schedules/l4_runtime_state_schedule.json
    window: design window (start/fork/end on the 5-tick formal grid)

schema: aeroworld_l4_window_config
version: 1
arm_id: arm_emergency_stop_withheld
group_key: L4-4_v2/seed01/grp_crossing_trajectories
episode_id: L4-4_v2__seed01
event_family: l4_uav_vehicle_contact_observed
subject_class: uav
mode: intervention
entity_ids:
- uav_falls_vehicle_l4_4_v2
- car_under_uav_l4_4_v2
predicate_ids:
- l4_business.uav_vehicle_proximity
- l4_business.uav_vehicle_contact
- l4_business.uav_damaged
- l4_business.uav_airborne
- l4_business.vehicle_emergency_stop_active
- l4_business.vehicle_physically_stopped
window:
  start_tick: 235
  fork_tick: 240
  end_tick: 700
  phase: after_state_sample_before_actions
  intervention_order: source_actions_then_intervention
sources:
  scene: Dataset/scenarios/L4_agents/collision/L4-4_v2/scene_setup.json
  script: Dataset/scenarios/L4_agents/collision/L4-4_v2/event_script.json
  trajectories: aw_data/render_ready_episodes_capture_filtered/L4-4_v2__seed01/trajectories.jsonl
  weather: aw_data/render_ready_episodes_capture_filtered/L4-4_v2__seed01/weather_meta.jsonl
  roster: aw_data/render_ready_episodes_capture_filtered/L4-4_v2__seed01/global_entity_roster.json
  event_realization: aw_data/render_ready_episodes_capture_filtered/L4-4_v2__seed01/event_realization.jsonl
  predicate_transitions: aw_data/objective_semantic_truth/L4-4_v2__seed01/predicate_transitions.jsonl
  event_outcomes: aw_data/objective_semantic_truth/L4-4_v2__seed01/event_outcomes.jsonl
execution:
  omit_action_ids:
  - move_vehicle_emergency_brake
  - set_runtime_state_l4_4_v2_vehicle_roof_contact_01
  actions:
  - tick: 315
    action:
      type: move_entity
      action_id: arm_emergency_stop_withheld_move_vehicle
      entity_id: car_under_uav_l4_4_v2
      velocity_mps: 0.3
      waypoints_enu_m:
      - - 6134.791
        - 7528.374
        - 0.0
      - - 6152.958456327348
        - 7536.737224891985
        - 0.0
  trigger_rewrites: []
expected:
  target_event: observe
  rationale: Preserve the authored contact and damage response. Replace the subsequent short low-speed repositioning with sustained forward creep. The vehicle
    can be stationary before contact; after the replacement move starts it must remain moving within the window. No false braking declaration is made, and
    no emergency-stop completion is written.
  falsified_if: Contact or damage does not occur, or the vehicle reaches recorded zero speed after the replacement response starts, or emergency_stop becomes
    true.
script: scripts/arms/L4-4_v2/seed01/grp_crossing_trajectories/arm_emergency_stop_withheld.py
output: arms/L4-4_v2/seed01/grp_crossing_trajectories/arm_emergency_stop_withheld
provenance:
  experiment_ref: design/L4-4_v2/seed01/grp_crossing_trajectories/experiment.json
  parameter_sources:
    factual_root: aw_data
    business_rules: Dataset/semantic_rules/profiles/l4_arm_business_semantics.json
    runtime_state_schedule: Dataset/semantic_rules/profiles/epi_runtime_state_schedules/l4_runtime_state_schedule.json
    window: design window (start/fork/end on the 5-tick formal grid)

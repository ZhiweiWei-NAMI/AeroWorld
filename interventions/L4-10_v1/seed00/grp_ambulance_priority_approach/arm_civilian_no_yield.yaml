expected:
  target_event: observe
  rationale: The civilian keeps driving in the through lane without a yielding state. From its measured tick-240
    position, the ambulance moves 2 m forward at at most 0.5 m/s and then stops. Both vehicles remain observed through
    tick 560 because no passage completes. The request may be acknowledged, but yield_clearance_satisfied and priority_passage_completed
    are expected false throughout the window.
  falsified_if: The ambulance reverses along the approach direction, a yielding state appears, lateral clearance
    or passage completion becomes true, or either subject disappears before the window ends.
script: scripts/arms/L4-10_v1/seed00/grp_ambulance_priority_approach/arm_civilian_no_yield.py

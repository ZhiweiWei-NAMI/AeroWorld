expected:
  target_event: observe
  rationale: The civilian begins the original pull-over and its yielding state at tick 280, 60 ticks later than
    factual. From its measured tick-240 position, the ambulance moves 3 m forward at at most 0.5 m/s, then waits
    at that endpoint until tick 330 and resumes forward at the original 10 m/s. Both vehicles remain observed through
    tick 560. Clearance and passage are measured from the resulting trajectories and are expected later than factual.
  falsified_if: The ambulance reverses along the approach direction, the passage completes at or before factual,
    clearance never appears, yielding is declared before the delayed pull-over, or either subject disappears before
    the window ends.

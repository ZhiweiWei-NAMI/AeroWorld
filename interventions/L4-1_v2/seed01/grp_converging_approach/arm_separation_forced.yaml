    - "move_uav_b_converge"
  actions:
    - tick: 240
      action:
        type: "move_entity"
        action_id: "arm_move_uav_conflict_l4_1_v2_b_separation_hold"
        entity_id: "uav_conflict_l4_1_v2_b"
        velocity_mps: 7.5
        waypoints_enu_m:
          - [6205.444, 6872.292, 30.0]
          - [6225.444, 6885.292, 60.0]
          - [6240.444, 6902.292, 80.0]
  trigger_rewrites: []
expected:
  target_event: "absent_in_window"
  rationale: "entity_proximity 需 xy≤20.788 且 |dz|≤35 同时成立；B 机在 fork tick 以 move_entity 被引离，先爬升同时横向远离 A 航线，末端保持点与 A 终点 hover 位 xy 距离远大于阈值，条件整窗不满足，min_true_ticks 无从累计。"
  falsified_if: "窗内任一时刻两机 xy≤20.788 且 |dz|≤35（即谓词 rising），或 uav_conflict_resolution / resume_patrols 事件在窗内出现。"
script: "scripts/arms/L4-1_v2/seed01/grp_converging_approach/arm_separation_forced.py"
output: "arms/L4-1_v2/seed01/grp_converging_approach/arm_separation_forced"
provenance:
  experiment_ref: "design/L4-1_v2/seed01/grp_converging_approach/experiment.json"
  parameter_sources:
    factual_root: "aw_data"
    omitted_action_ids: "move_uav_b_converge（converging_approach 内 B 机汇合 move）于 Dataset/scenarios/L4_agents/collision/L4-1_v2/event_script.json"
    intervention_waypoints: "design parameter_sources.intervention_hold_waypoints_enu_m（末端保持点与 A 终点 [6193.444, 6866.292, 50.0] xy 距离 > 20.788 m）"
